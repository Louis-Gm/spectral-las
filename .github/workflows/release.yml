name: Release to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built distributions to production PyPI"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-wheels:
    name: Wheels — ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Linux wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: "2014"
          args: --release --out dist -i python${{ matrix.python }}

      - name: Install maturin on Windows/macOS
        if: runner.os != 'Linux'
        run: python -m pip install "maturin>=1.7,<2"

      - name: Build Windows/macOS wheel
        if: runner.os != 'Linux'
        run: maturin build --release --out dist -i python

      - name: Install and smoke-test wheel outside the checkout
        shell: bash
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import spectral_las; import spectral_las._native"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: release-wheels-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: python -m pip install "maturin>=1.7,<2" twine

      - name: Build source distribution
        run: maturin sdist --out dist

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Verify source distribution rebuilds
        run: python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir rebuilt

      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish == true
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/spectral-las

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check all distribution metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/