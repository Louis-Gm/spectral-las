name: Package build

on:
  push:
    branches: [main]
    paths:
      - "package/**"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/package-build.yml"
  pull_request:
    paths:
      - "package/**"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/package-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build wheel on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build backend
        run: python -m pip install "maturin>=1.7,<2"
      - name: Build wheel
        run: maturin build --release --out dist
      - name: Smoke-test wheel import
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python - <<'PY'
          import spectral_las
          import spectral_las._native
          print("spectral_las import OK")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: spectral-las-wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
