[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "spectral-las"
version = "0.1.1"
description = "A Rust-backed Python package for point cloud colorization, supporting all your imagery needs from panchromatic, to RGB, to hyperspectral."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "numpy>=1.24,<2",
    "laspy>=2.5,<3",
    "rasterio>=1.4,<2",
    "pyproj>=3.4,<4",
    "numexpr>=2.8,<3",
]

[project.optional-dependencies]
laz = ["lazrs>=0.6"]
monitoring = ["psutil>=5.9"]

[tool.maturin]
python-source = "package/src"
module-name = "spectral_las._native"
features = ["pyo3/extension-module"]
include = ["LICENSE", "NOTICE"]

[project.urls]
Repository = "https://github.com/Louis-Gm/spectral-las"
Issues = "https://github.com/Louis-Gm/spectral-las/issues"
